              <div class="text-xs font-bold uppercase tracking-wider text-emerald-600 dark:text-emerald-400">Worked Solution</div>
              <ul class="space-y-3 list-disc pl-6">
                <li>First compute the dimensionless exponent $\\chi$ using $\\Delta_{\\text{vap}}H = 32\\,000\\text{ J mol}^{-1}$, $T^* = 350.0\\text{ K}$, and $T = 370.0\\text{ K}$:
                  $$\\chi = \\frac{\\Delta_{\\text{vap}}H}{R}\\left(\\frac{1}{T} - \\frac{1}{T^*}\\right) = \\frac{32\\,000\\text{ J mol}^{-1}}{8.314\\text{ J K}^{-1}\\text{ mol}^{-1}}\\left(\\frac{1}{370.0\\text{ K}} - \\frac{1}{350.0\\text{ K}}\\right) = (3848.9)(-1.544 \\times 10^{-4}) = -0.5944$$
                </li>
                <li>Substitute $\\chi$ into the integrated Clausius–Clapeyron expression $p = p^* e^{-\\chi}$:
                  $$p = (1.00\\text{ atm}) \\times e^{-(-0.5944)} = e^{+0.5944} = \\mathbf{1.81\\text{ atm}}$$
                </li>
                <li>Near the triple point, the solid–vapour sublimation curve has a steeper slope than the liquid–vapour vaporization curve because the molar enthalpy of sublimation equals the sum of fusion and vaporization enthalpies ($\\Delta_{\\text{sub}}H = \\Delta_{\\text{fus}}H + \\Delta_{\\text{vap}}H > \\Delta_{\\text{vap}}H$).</li>
              </ul>
            </div>
          </div>
        `
      }
    ];

    // State Variables
    let currentSlideIndex = 0;
    let currentDerivationStep = 6;

    const derivationData = [
      { step: 1, title: "1. Equilibrium Condition", math: "$$\\mu_\\alpha = \\mu_\\beta \\implies d\\mu_\\alpha = d\\mu_\\beta$$", desc: "Along a phase boundary, both phases maintain equal chemical potentials under infinitesimal shifts $(dp, dT)$." },
      { step: 2, title: "2. Fundamental Differential", math: "$$d\\mu = -S_m\\,dT + V_m\\,dp$$", desc: "Derived from $dG = Vdp - SdT$ divided by molar amount $n$." },
      { step: 3, title: "3. Equate Phase Differentials", math: "$$-S_{\\alpha,m}\\,dT + V_{\\alpha,m}\\,dp = -S_{\\beta,m}\\,dT + V_{\\beta,m}\\,dp$$", desc: "Substitute individual phase entropies and molar volumes for phases $\\alpha$ and $\\beta$." },
      { step: 4, title: "4. Group Like Terms", math: "$$(V_{\\beta,m} - V_{\\alpha,m})\\,dp = (S_{\\beta,m} - S_{\\alpha,m})\\,dT$$", desc: "Collect pressure differentials on the left and temperature differentials on the right." },
      { step: 5, title: "5. Transition Quantities", math: "$$\\Delta_{\\text{trs}}V\\,dp = \\Delta_{\\text{trs}}S\\,dT$$", desc: "Define $\\Delta_{\\text{trs}}V = V_{\\beta,m} - V_{\\alpha,m}$ and $\\Delta_{\\text{trs}}S = S_{\\beta,m} - S_{\\alpha,m}$." },
      { step: 6, title: "6. Exact Clapeyron Equation", math: "$$\\frac{dp}{dT} = \\frac{\\Delta_{\\text{trs}}S}{\\Delta_{\\text{trs}}V}$$", desc: "Exact expression for the slope of any phase boundary of a pure substance." }
    ];

    // DOM References
    const slideCard = document.getElementById('slideCard');
    const slideSectionTag = document.getElementById('slideSectionTag');
    const slideTitle = document.getElementById('slideTitle');
    const slideBody = document.getElementById('slideBody');
    const slideCounter = document.getElementById('slideCounter');
    const progressBar = document.getElementById('progressBar');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const tocList = document.getElementById('tocList');
    const tocSidebar = document.getElementById('tocSidebar');
    const sidebarBackdrop = document.getElementById('sidebarBackdrop');

    // Render KaTeX safely
    function renderMath(element) {
      if (window.renderMathInElement) {
        renderMathInElement(element, {
          delimiters: [
            { left: '$$', right: '$$', display: true },
            { left: '$', right: '$', display: false }
          ],
          throwOnError: false
        });
      }
    }

    // Build Table of Contents
    function buildTOC() {
      tocList.innerHTML = slides.map((s, idx) => `
        <button onclick="goToSlide(${idx}); closeSidebar();" class="w-full text-left p-2.5 rounded-xl text-sm transition flex items-start gap-2.5 ${idx === currentSlideIndex ? 'bg-indigo-50 dark:bg-indigo-950/70 text-indigo-700 dark:text-indigo-300 font-semibold border border-indigo-200 dark:border-indigo-800' : 'hover:bg-slate-100 dark:hover:bg-slate-800/70 text-slate-700 dark:text-slate-300'}">
          <span class="font-mono text-xs px-1.5 py-0.5 rounded bg-slate-200/70 dark:bg-slate-800 text-slate-600 dark:text-slate-400 mt-0.5">${String(idx + 1).padStart(2, '0')}</span>
          <span class="leading-snug">${s.title}</span>
        </button>
      `).join('');
    }

    // Main Render Function
    function renderSlide(index) {
      currentSlideIndex = Math.max(0, Math.min(slides.length - 1, index));
      const slide = slides[currentSlideIndex];

      slideSectionTag.textContent = slide.section;
      slideTitle.textContent = slide.title;
      slideBody.innerHTML = slide.render();

      // Re-trigger fade animation
      slideBody.classList.remove('slide-fade-in');
      void slideBody.offsetWidth;
      slideBody.classList.add('slide-fade-in');

      // Update counters and progress bar
      slideCounter.textContent = `Slide ${currentSlideIndex + 1} / ${slides.length}`;
      const pct = ((currentSlideIndex + 1) / slides.length) * 100;
      progressBar.style.width = `${pct}%`;

      prevBtn.disabled = currentSlideIndex === 0;
      nextBtn.disabled = currentSlideIndex === slides.length - 1;

      // Slide-specific initializations
      if (currentSlideIndex === 6) setWaterMode('low');
      if (currentSlideIndex === 10) updateMuTempPlot(80);
      if (currentSlideIndex === 11) updateFig5(65);
      if (currentSlideIndex === 12) updateFig6(65);
      if (currentSlideIndex === 14) renderDerivationSteps();

      renderMath(slideCard);
      buildTOC();
    }

    function goToSlide(index) {
      renderSlide(index);
    }

    // Interactive Water Diagram Switcher (Slide 7)
    window.setWaterMode = function(mode) {
      const svg = document.getElementById('waterSvg');
      const lowBtn = document.getElementById('waterLowBtn');
      const highBtn = document.getElementById('waterHighBtn');
      if (!svg) return;

      if (mode === 'low') {
        lowBtn.className = "px-2 py-0.5 text-xs font-semibold rounded bg-blue-600 text-white";
        highBtn.className = "px-2 py-0.5 text-xs font-semibold rounded bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200";
        svg.innerHTML = `
          <path d="M 45 20 L 145 20 L 160 155 L 45 215 Z" fill="#3b82f6" fill-opacity="0.14" />
          <path d="M 145 20 L 320 20 L 300 65 Q 230 115 160 155 Z" fill="#06b6d4" fill-opacity="0.14" />
          <path d="M 45 215 L 160 155 Q 230 115 300 65 L 335 65 L 335 230 L 45 230 Z" fill="#f59e0b" fill-opacity="0.12" />
          <line x1="45" y1="115" x2="335" y2="115" stroke="#ef4444" stroke-width="1.3" stroke-dasharray="4,3" />
          <text x="275" y="109" fill="#ef4444" font-size="9.5" font-weight="bold">1 atm</text>
          <path d="M 45 215 Q 105 186 160 155" fill="none" stroke="#2563eb" stroke-width="2.5" />
          <line x1="160" y1="155" x2="144" y2="20" stroke="#2563eb" stroke-width="2.5" />
          <path d="M 160 155 Q 230 115 300 65" fill="none" stroke="#2563eb" stroke-width="2.5" />
          <circle cx="160" cy="155" r="4.5" fill="#dc2626" />
          <text x="167" y="164" fill="#dc2626" font-size="9.5" font-weight="bold">T₃ (0.01°C, 611 Pa)</text>
          <circle cx="300" cy="65" r="4.5" fill="#0284c7" />
          <text x="242" y="56" fill="#0284c7" font-size="9.5" font-weight="bold">Tc (374°C, 218 atm)</text>
          <text x="75" y="95" fill="#1d4ed8" font-size="13" font-weight="bold">Ice I</text>
          <text x="185" y="75" fill="#0e7490" font-size="13" font-weight="bold">Liquid</text>
          <text x="220" y="205" fill="#b45309" font-size="13" font-weight="bold">Vapour</text>
          <text x="52" y="42" fill="#dc2626" font-size="9.5" font-weight="bold">Negative slope (dP/dT &lt; 0)</text>
          <line x1="45" y1="20" x2="45" y2="230" stroke="currentColor" class="text-slate-400" stroke-width="1.5" />
          <line x1="45" y1="230" x2="335" y2="230" stroke="currentColor" class="text-slate-400" stroke-width="1.5" />
          <text x="155" y="255" fill="currentColor" class="text-slate-500" font-size="11" font-weight="600">Temperature, T</text>
          <text x="14" y="150" fill="currentColor" class="text-slate-500" font-size="11" font-weight="600" transform="rotate(-90 14 150)">Pressure, p</text>
        `;
      } else {
        highBtn.className = "px-2 py-0.5 text-xs font-semibold rounded bg-blue-600 text-white";
        lowBtn.className = "px-2 py-0.5 text-xs font-semibold rounded bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200";
        svg.innerHTML = `
          <rect x="45" y="20" width="290" height="210" fill="#3b82f6" fill-opacity="0.06" />
          <!-- High Pressure Ice Regions -->
          <path d="M 45 110 L 145 110 L 145 210 L 45 210 Z" fill="#6366f1" fill-opacity="0.16" />
          <path d="M 45 78 L 152 78 L 145 110 L 45 110 Z" fill="#8b5cf6" fill-opacity="0.18" />
          <path d="M 45 52 L 175 52 L 152 78 L 45 78 Z" fill="#0ea5e9" fill-opacity="0.18" />
          <path d="M 45 20 L 235 20 Q 205 42 175 52 L 45 52 Z" fill="#14b8a6" fill-opacity="0.2" />

          <!-- Boundaries -->
          <line x1="45" y1="110" x2="145" y2="110" stroke="#4f46e5" stroke-width="1.8" />
          <line x1="45" y1="78" x2="152" y2="78" stroke="#4f46e5" stroke-width="1.8" />
          <line x1="45" y1="52" x2="175" y2="52" stroke="#4f46e5" stroke-width="1.8" />
          <path d="M 145 210 L 145 110 L 152 78 L 175 52 Q 205 40 265 22" fill="none" stroke="#2563eb" stroke-width="2.5" />
          <path d="M 145 210 Q 195 175 245 145" fill="none" stroke="#2563eb" stroke-width="2" />

          <!-- Polymorph Labels -->
          <text x="85" y="165" fill="#4338ca" font-size="13" font-weight="bold">Ice I</text>
          <text x="82" y="98" fill="#6d28d9" font-size="11" font-weight="bold">Ice II / III / V</text>
          <text x="85" y="69" fill="#0369a1" font-size="11" font-weight="bold">Ice VI</text>
          <text x="115" y="40" fill="#0f766e" font-size="12" font-weight="bold">Ice VII (&gt;25 kbar)</text>
          <text x="225" y="95" fill="#1d4ed8" font-size="13" font-weight="bold">Liquid</text>
          <text x="235" y="195" fill="#b45309" font-size="12" font-weight="bold">Vapour</text>

          <line x1="45" y1="20" x2="45" y2="230" stroke="currentColor" class="text-slate-400" stroke-width="1.5" />
          <line x1="45" y1="230" x2="335" y2="230" stroke="currentColor" class="text-slate-400" stroke-width="1.5" />
          <text x="145" y="255" fill="currentColor" class="text-slate-500" font-size="11" font-weight="600">Temperature, T (K)</text>
          <text x="14" y="155" fill="currentColor" class="text-slate-500" font-size="11" font-weight="600" transform="rotate(-90 14 155)">log Pressure (Pa)</text>
        `;
      }
    };

    // Interactive Chemical Potential vs T (Slide 11)
    window.updateMuTempPlot = function(val) {
      const x = parseFloat(val);
      const cursor = document.getElementById('tempCursorLine');
      const dot = document.getElementById('tempCursorDot');
      const badge = document.getElementById('stablePhaseBadge');
      if (!cursor) return;

      cursor.setAttribute('x1', x);
      cursor.setAttribute('x2', x);
      dot.setAttribute('cx', x);

      // Compute y values along the three lines
      const ySolid = 45 + ((x - 35) / 290) * 60;
      const yLiquid = 20 + ((x - 55) / 255) * 135;
      const yGas = 15 + ((x - 145) / 150) * 190;

      // Lowest chemical potential wins (highest y coordinate on SVG)
      let maxY = ySolid;
      let phase = "Stable: Solid";
      let badgeClass = "text-xs font-bold px-2.5 py-0.5 rounded-full bg-purple-100 text-purple-800 dark:bg-purple-950 dark:text-purple-300";

      if (yLiquid > maxY) {
        maxY = yLiquid;
        phase = "Stable: Liquid";
        badgeClass = "text-xs font-bold px-2.5 py-0.5 rounded-full bg-blue-100 text-blue-800 dark:bg-blue-950 dark:text-blue-300";
      }
      if (yGas > maxY) {
        maxY = yGas;
        phase = "Stable: Gas";
        badgeClass = "text-xs font-bold px-2.5 py-0.5 rounded-full bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300";
      }

      dot.setAttribute('cy', Math.min(192, maxY));
      badge.textContent = phase;
      badge.className = badgeClass;
    };

    // Interactive Figure 5 Slider (Slide 12)
    window.updateFig5 = function(val) {
      const p = parseFloat(val) / 100; // 0.1 to 1.0
      const solidLine = document.getElementById('fig5Solid');
      const liquidLine = document.getElementById('fig5Liquid');
      const dot = document.getElementById('fig5Dot');
      const drop = document.getElementById('fig5Drop');
      const tfPrime = document.getElementById('fig5TfPrime');
      const label = document.getElementById('fig5Label');
      if (!solidLine) return;

      const shiftS = p * 35;
      const shiftL = p * 95;

      // Solid line: base (40,115)->(220,165) shifted up by shiftS
      solidLine.setAttribute('y1', 115 - shiftS);
      solidLine.setAttribute('y2', 165 - shiftS + 15);

      // Liquid line: base (110,65)->(195,205) shifted up/right
      const lx1 = 110 + shiftL * 0.75;
      const lx2 = 195 + shiftL * 0.95;
      liquidLine.setAttribute('x1', lx1);
      liquidLine.setAttribute('y1', 45);
      liquidLine.setAttribute('x2', lx2);
      liquidLine.setAttribute('y2', 205);

      const interX = 145 + p * 115;
      const interY = 144 - p * 15;
      dot.setAttribute('cx', interX);
      dot.setAttribute('cy', interY);
      drop.setAttribute('x1', interX);
      drop.setAttribute('x2', interX);
      drop.setAttribute('y1', interY);
      tfPrime.setAttribute('x', interX - 6);
      label.textContent = `ΔP = +${val}% → Tf' > Tf`;
    };

    // Interactive Figure 6 Slider (Slide 13)
    window.updateFig6 = function(val) {
      const p = parseFloat(val) / 100;
      const solidLine = document.getElementById('fig6Solid');
      const liquidLine = document.getElementById('fig6Liquid');
      const dot = document.getElementById('fig6Dot');
      const drop = document.getElementById('fig6Drop');
      const tfPrime = document.getElementById('fig6TfPrime');
      const label = document.getElementById('fig6Label');
      if (!solidLine) return;

      const shiftS = p * 95;
      const shiftL = p * 35;

      solidLine.setAttribute('y1', 120 - shiftS);
      solidLine.setAttribute('y2', 180 - shiftS);

      liquidLine.setAttribute('x1', 165 - shiftL * 1.4);
      liquidLine.setAttribute('x2', 265 - shiftL * 0.9);

      const interX = 215 - p * 115;
      const interY = 165 - p * 118;
      dot.setAttribute('cx', interX);
      dot.setAttribute('cy', interY);
      drop.setAttribute('x1', interX);
      drop.setAttribute('x2', interX);
      drop.setAttribute('y1', interY);
      tfPrime.setAttribute('x', interX - 7);
      label.textContent = `ΔP = +${val}% → Tf' < Tf`;
    };

    // Interactive Derivation Stepper (Slide 15)
    function renderDerivationSteps() {
      const container = document.getElementById('derivationStepsContainer');
      const count = document.getElementById('derivStepCount');
      if (!container) return;

      count.textContent = `Step ${currentDerivationStep} / 6`;
      container.innerHTML = derivationData.map(item => {
        const visible = item.step <= currentDerivationStep;
        const active = item.step === currentDerivationStep;
        return `
          <div class="p-3.5 rounded-xl border transition-all ${visible ? (active ? 'bg-indigo-50/90 dark:bg-indigo-950/60 border-indigo-400 dark:border-indigo-600 shadow-sm' : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-700') : 'opacity-25 bg-slate-100 dark:bg-slate-900/40 border-slate-200 dark:border-slate-800'}">
            <div class="font-bold text-xs text-indigo-600 dark:text-indigo-400 mb-1">${item.title}</div>
            <div class="text-slate-900 dark:text-white font-medium">${item.math}</div>
            <div class="text-xs text-slate-600 dark:text-slate-400 mt-1">${item.desc}</div>
          </div>
        `;
      }).join('');
      renderMath(container);
    }

    window.nextDerivationStep = function() {
      currentDerivationStep = currentDerivationStep < 6 ? currentDerivationStep + 1 : 1;
      renderDerivationSteps();
    };

    window.prevDerivationStep = function() {
      currentDerivationStep = currentDerivationStep > 1 ? currentDerivationStep - 1 : 6;
      renderDerivationSteps();
    };

    // Exercise Solution & Answer Checkers (Slides 18-20)
    window.toggleSolution = function(id, btn) {
      const el = document.getElementById(id);
      if (!el) return;
      const isHidden = el.classList.contains('hidden');
      if (isHidden) {
        el.classList.remove('hidden');
        btn.textContent = 'Hide Step-by-Step Solution';
        renderMath(el);
      } else {
        el.classList.add('hidden');
        btn.textContent = 'Show Step-by-Step Solution';
      }
    };

    window.checkEx2Answer = function() {
      const val = parseFloat(document.getElementById('ex2Input').value);
      const fb = document.getElementById('ex2Feedback');
      if (isNaN(val)) {
        fb.textContent = 'Please enter a numerical value in Kelvin.';
        fb.className = 'text-xs font-semibold text-amber-600 dark:text-amber-400';
        return;
      }
      if (Math.abs(val - 272.41) <= 0.1) {
        fb.textContent = '✓ Correct! T = 272.41 K (freezing point decreases by 0.74 K).';
        fb.className = 'text-xs font-semibold text-emerald-600 dark:text-emerald-400';
      } else {
        fb.textContent = '✗ Not quite. Remember ΔfusV is negative for water, so T < 273.15 K.';
        fb.className = 'text-xs font-semibold text-rose-600 dark:text-rose-400';
      }
    };

    window.checkEx3Answer = function() {
      const val = parseFloat(document.getElementById('ex3Input').value);
      const fb = document.getElementById('ex3Feedback');
      if (isNaN(val)) {
        fb.textContent = 'Please enter a numerical pressure in atm.';
        fb.className = 'text-xs font-semibold text-amber-600 dark:text-amber-400';
        return;
      }
      if (Math.abs(val - 1.81) <= 0.05) {
        fb.textContent = '✓ Correct! Vapour pressure rises to 1.81 atm at 370.0 K.';
        fb.className = 'text-xs font-semibold text-emerald-600 dark:text-emerald-400';
      } else {
        fb.textContent = '✗ Check your signs: since T > T*, vapour pressure must exceed 1.00 atm.';
        fb.className = 'text-xs font-semibold text-rose-600 dark:text-rose-400';
      }
    };

    // Sidebar Controls
    function openSidebar() {
      tocSidebar.classList.remove('-translate-x-full');
      sidebarBackdrop.classList.remove('hidden');
    }
    function closeSidebar() {
      tocSidebar.classList.add('-translate-x-full');
      sidebarBackdrop.classList.add('hidden');
    }

    document.getElementById('toggleSidebarBtn').addEventListener('click', openSidebar);
    document.getElementById('closeSidebarBtn').addEventListener('click', closeSidebar);
    sidebarBackdrop.addEventListener('click', closeSidebar);

    // Navigation Buttons
    prevBtn.addEventListener('click', () => goToSlide(currentSlideIndex - 1));
    nextBtn.addEventListener('click', () => goToSlide(currentSlideIndex + 1));

    // Keyboard Navigation
    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      if (e.key === 'ArrowRight' || e.key === ' ') {
        e.preventDefault();
        if (currentSlideIndex < slides.length - 1) goToSlide(currentSlideIndex + 1);
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        if (currentSlideIndex > 0) goToSlide(currentSlideIndex - 1);
      } else if (e.key === 'Escape') {
        closeSidebar();
      }
    });

    // Dark/Light Mode Toggle
    document.getElementById('themeToggleBtn').addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
    });

    // Initialize on load
    window.addEventListener('DOMContentLoaded', () => {
      renderSlide(0);
    });
  </script>
</body>
